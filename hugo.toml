baseURL = "https://ogle.computer/"
title = "ogle"
languageCode = "en-us"
theme = "hello-friend-ng"
enableRobotsTXT = true

[pagination]
  pagerSize = 10

[params]
  homeSubtitle = "Systems engineer. Autonomy, validation, and cyberphysical experiments."
  dateform = "2006-01-02"
  dateformShort = "Jan 2"
  description = "Blog + Portfolio of Alexander Ogle"
  enableDarkToggle = true
  logoText = ">ogle"

[languages]
  [languages.en]
    title = "ogle.computer"
  [languages.en.params.logo]
    logoText = "ogle.computer"
    logoHomeLink = "/"

# Optional: socials (adjust as needed)
[[params.social]]
  name = "github"
  url  = "https://github.com/oglecomputer"
[[params.social]]
  name = "x"
  url  = "https://x.com/nullaeon"

[menu]
  [[menu.main]]
    name = "Blog"
    url  = "/posts/"
    weight = 1
  [[menu.main]]
    name = "Projects"
    url  = "/projects/"
    weight = 2
  [[menu.main]]
    name = "About"
    url  = "/about/"
    weight = 3

# Put posts + projects on homepage lists
[params.list]
  showSummary = true

[taxonomies]
  tag = "tags"
  category = "categories"

[outputs]
  home = ["HTML","RSS","JSON"]

